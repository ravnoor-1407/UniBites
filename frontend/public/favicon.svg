<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1F3D" />
      <stop offset="100%" stop-color="#5E1730" />
    </linearGradient>
    <linearGradient id="mustardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3A82B" />
      <stop offset="100%" stop-color="#C98F1A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2B1B1F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base in Primary Burgundy -->
  <rect x="8" y="8" width="112" height="112" rx="32" fill="url(#bgGrad)" />
  
  <!-- Subtle Cream/White inner border -->
  <rect x="10" y="10" width="108" height="108" rx="30" stroke="#FBF6EC" stroke-opacity="0.25" stroke-width="2" />

  <!-- UniBites Brand Symbol: Stylized 'U' + Gourmet Cloche with Mustard Highlights -->
  <g filter="url(#shadow)">
    <!-- Cloche dome in Pure White -->
    <path d="M34 68 C34 46 50 36 64 36 C78 36 94 46 94 68 Z" fill="#FFFFFF" />
    <!-- Cloche knob in Accent Mustard -->
    <circle cx="64" cy="30" r="5" fill="url(#mustardGrad)" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Tray base line in Accent Mustard -->
    <rect x="28" y="72" width="72" height="7" rx="3.5" fill="url(#mustardGrad)" />
    
    <!-- Central Bite Notch Effect -->
    <circle cx="82" cy="54" r="10" fill="url(#bgGrad)" />

    <!-- Collegiate Spark / Star in Accent Mustard -->
    <path d="M96 24 L98.5 30 L104.5 32.5 L98.5 35 L96 41 L93.5 35 L87.5 32.5 L93.5 30 Z" fill="#E3A82B" />

    <!-- Monogram 'U' Accent Line in Soft Cream -->
    <path d="M48 88 C48 97 55 102 64 102 C73 102 80 97 80 88" stroke="#FBF6EC" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>
</svg>
